<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">

<!-- Content-Security-Policy. GitHub Pages cannot set headers, so the policy
     ships as a meta tag; it is enforced identically apart from the header-only
     directives (frame-ancestors / report-to), which are therefore omitted.

     script-src is 'self' plus one sha256 per inline script — the import map
     and the splash bootstrap at the bottom of this file. Adding a hash makes
     CSP3 browsers ignore 'unsafe-inline' entirely, so any injected inline
     script is refused: the second line of defence the hand-rolled esc()
     helpers cannot provide on their own. Edit either inline script and you
     MUST recompute its hash or the app will not boot.

     style-src keeps 'unsafe-inline': the views build scoped <style> blocks and
     style="" attributes by design. That is exactly why colour values coming
     from the Terma vision model must be validated as #rrggbb at the boundary —
     see js/terma.js — because CSS is the one context esc() does not neutralise.
     It no longer allows fonts.googleapis.com, and font-src is now 'self' alone:
     the brand faces (Anton + Figtree) are vendored under /vendor/fonts/ and
     loaded by css/styles.css, so the app makes no font request off-origin.
     img-src 'self' data: covers the procedural swatches (canvas.toDataURL) and
     the base64 photo previews, and blocks the url() beacon a CSS injection
     would otherwise fire.
     connect-src allows Supabase (catalog mirror + the Terma Edge Function);
     it is a wildcard because js/config.js is filled in per deployment.
     cdn.jsdelivr.net is ONLY the transitional supabase-js fallback in
     js/supabaseClient.js — remove it here once that library is vendored under
     /vendor/, as docs/BUILD_CONTRACTS.md requires. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'none';
  object-src 'none';
  form-action 'none';
  script-src 'self' 'sha256-D2XnioWKWXcIE2epN670TChceWuJD92o/6GT7rIBAsw=' 'sha256-6G61/LDa3KMcuKr7MoxiJUAhQKSNzEtJUw3h9otBbms=' https://cdn.jsdelivr.net;
  style-src 'self' 'unsafe-inline';
  font-src 'self';
  img-src 'self' data:;
  connect-src 'self' https://*.supabase.co;
  worker-src 'self';
  manifest-src 'self'
">

<!-- viewport-fit=cover is what lets the glass bars run under the iOS notch and
     home indicator; every fixed surface pays for it with env(safe-area-inset-*). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Akvaterm — Katalog i dizajner</title>
<meta name="description" content="Akvaterm Dubrovnik — katalog opreme, dizajner prostorija i digitalni savjetnik. Demo verzija.">
<!-- #F4F8F9 is the Iris glass tint hsl(187 44% 97%) composited at the shipped
     --glass-alpha-text of .78 over --paper #F2F2F2 — i.e. exactly what the top
     bar paints when the page behind it is at rest. Matching it here stops the
     browser chrome from stepping out of the app on scroll.
     (manifest.webmanifest still carries the retired navy — see handoff.) -->
<meta name="theme-color" content="#F4F8F9">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">

<!-- Brand type is VENDORED: Anton (display) + Figtree (text), SIL OFL 1.1,
     under /vendor/fonts/ and pulled in by the @import at the top of
     css/styles.css. There is no runtime CDN — the retired Open Sans <link> to
     fonts.googleapis.com is gone, and the CSP above no longer permits it. -->

<!-- iOS 26 samples the html/body background colour to tint its own chrome, and
     a root with no background makes it sample whatever paints behind. Declared
     here as well as in css/styles.css so the value exists even if the
     stylesheet is slow or fails; both say --paper #F2F2F2. -->
<style>html,body{background:#F2F2F2}html{color-scheme:light}</style>

<link rel="stylesheet" href="css/styles.css">

<!-- three.js resolves through this map to the vendored copy (lazy-loaded by
     js/room3d.js only when the 3D room opens). Must precede any module script. -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>

<!-- Branded splash — visible on first paint (styles.css is render-blocking).
     The inline script below owns its dismissal; js/app.js asks for it once the
     first view has painted and never removes this element itself.

     The wordmark is Akvaterm's own identity and is EXEMPT from the Iris
     palette by operator instruction: AKVA in navy (--logo-navy #00008C), TERM
     in red (--logo-red #d6252e), italic 800 in the text face — not Anton, not
     teal/amber. css/styles.css owns those protected tokens; do not restyle the
     logo when the palette changes. The rule beneath it sweeps teal -> amber,
     which is where the Iris palette belongs. -->
<div id="splash" aria-hidden="true">
  <div class="sp-core">
    <div class="sp-mark wordmark"><span class="akva">AKVA</span><span class="term">TERM</span></div>
    <div class="sp-rule"><i></i></div>
  </div>
</div>

<!-- App mount point — js/app.js looks this element up by id and owns everything
     inside it. The id must stay "app": app.js falls back to rebuilding the
     shell (and wiping the splash with it) when it cannot find this element. -->
<div id="app"></div>

<noscript>
  <div style="max-width:420px;margin:15vh auto 0;padding:24px;text-align:center;font-family:system-ui,sans-serif">
    <p><b>Akvaterm</b></p>
    <p>Aplikacija zahtijeva uključen JavaScript. Molimo omogućite JavaScript u pregledniku.</p>
  </div>
</noscript>

<script>
/* Splash dismissal. The splash fades once the first view has painted (app.js
   dispatches "akv:ready"), never sooner than 700 ms so it cannot blink, and a
   4 s watchdog guarantees it can never trap the user behind the veil.
   Service-worker registration lives in js/app.js — one registration only. */
(function () {
  var MIN_MS = 700, WATCHDOG_MS = 4000, t0 = Date.now(), done = false;

  function hideSplash() {
    if (done) return;
    done = true;
    var splash = document.getElementById("splash");
    if (!splash) return;
    var wait = Math.max(0, MIN_MS - (Date.now() - t0));
    setTimeout(function () {
      splash.classList.add("out");
      setTimeout(function () { splash.classList.add("gone"); }, 560);
    }, wait);
  }

  window.akvHideSplash = hideSplash;                 /* app.js calls this directly */
  window.addEventListener("akv:ready", hideSplash);  /* …or via the event, either works */
  window.addEventListener("load", hideSplash);       /* safety net if the app never boots */
  setTimeout(hideSplash, WATCHDOG_MS);
})();
</script>

<script type="module" src="js/app.js"></script>
</body>
</html>
